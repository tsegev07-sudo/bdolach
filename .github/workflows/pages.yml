# Publishes the app (the www/ folder) as a website on GitHub Pages, for
# iPhone / iPad and browsers:  https://tsegev07-sudo.github.io/bdolach/
# Runs on every push to main. To run it by hand: Actions -> Publish website
# -> Run workflow.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces one still waiting
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Turns GitHub Pages on if it isn't yet. If this step fails, turn it on
      # by hand: Settings -> Pages -> Source: "GitHub Actions", then run again.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
