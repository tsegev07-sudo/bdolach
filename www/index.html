<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2933">
  <title>בד"ח סופה</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <!-- iPhone / iPad: "Add to Home Screen" opens full screen, with this icon -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="בד&quot;ח סופה">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Colour tabs (yellow / white / green / red), built by js/app.js -->
  <nav id="tabs" class="tabs" aria-label="לשוניות"></nav>

  <header class="topbar">
    <button id="homeBtn" class="icon-btn" aria-label="תוכן עניינים">☰</button>
    <div class="topbar-title">
      <div id="pageHeader" class="page-header"></div>
      <div id="pageLabel" class="page-label"></div>
    </div>
    <div class="topbar-tools">
      <button id="nightBtn" class="icon-btn" aria-label="מצב לילה">☾</button>
    </div>
  </header>

  <main id="page" class="page" tabindex="-1"></main>

  <!-- Floating page buttons (no bar). As in a Hebrew book:
       "חזור" on the right returns to the page you were on before,
       "המשך" on the left goes to the next page. -->
  <button id="backBtn" class="fab fab-back">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    חזור
  </button>
  <button id="nextBtn" class="fab fab-next">
    המשך
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <!-- Shown only when something on the page is ticked -->
  <button id="resetBtn" class="fab-pill" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
    נקה סימונים
  </button>

  <!-- Pop-up used for the table of contents and messages -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <button id="sheetClose" class="sheet-close" aria-label="סגור">✕</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Content first, then the app that renders it -->
  <script src="content/book.js"></script>
  <script src="content/white.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
