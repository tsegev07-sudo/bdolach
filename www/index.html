<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2933">
  <title>בד"ח סופה</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <!-- iPhone / iPad: "Add to Home Screen" opens full screen, with this icon -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="בד&quot;ח סופה">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Colour tabs (yellow / white / green / red), built by js/app.js -->
  <nav id="tabs" class="tabs" aria-label="לשוניות"></nav>

  <header class="topbar">
    <button id="homeBtn" class="icon-btn" aria-label="תוכן עניינים">☰</button>
    <div class="topbar-title">
      <div id="pageHeader" class="page-header"></div>
      <div id="pageLabel" class="page-label"></div>
    </div>
    <div class="topbar-tools">
      <button id="fontDown" class="icon-btn" aria-label="הקטן טקסט">א-</button>
      <button id="fontUp" class="icon-btn" aria-label="הגדל טקסט">א+</button>
      <button id="nightBtn" class="icon-btn" aria-label="מצב לילה">☾</button>
    </div>
  </header>

  <main id="page" class="page" tabindex="-1"></main>

  <footer class="bottombar">
    <button id="prevBtn" class="nav-btn">→ לעמוד הקודם</button>
    <button id="resetBtn" class="nav-btn small">נקה סימונים</button>
    <button id="nextBtn" class="nav-btn">עמוד הבא ←</button>
  </footer>

  <!-- Pop-up used for note references (the boxed numbers) and messages -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <button id="sheetClose" class="sheet-close" aria-label="סגור">✕</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Content first, then the app that renders it -->
  <script src="content/book.js"></script>
  <script src="content/white.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
